  <!-- Sonido de burbuja al hacer clic en cualquier parte (Web Audio, sin archivos) -->
  <script>
  (function () {
    var actx = null;
    function pop() {
      try {
        if (!actx) {
          var AC = window.AudioContext || window.webkitAudioContext;
          if (!AC) return;
          actx = new AC();
        }
        if (actx.state === 'suspended') { actx.resume(); }
        var t = actx.currentTime;
        var base = 360 + Math.random() * 200;            // jitter de tono = cada pop suena distinto
        var osc = actx.createOscillator();
        var gain = actx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(base, t);
        osc.frequency.exponentialRampToValueAtTime(base * 2.4, t + 0.05); // "bloop" ascendente de burbuja
        gain.gain.setValueAtTime(0.0001, t);
        gain.gain.exponentialRampToValueAtTime(0.26, t + 0.006);          // ataque rápido (tronido)
        gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.14);         // cola corta
        osc.connect(gain).connect(actx.destination);
        osc.start(t);
        osc.stop(t + 0.16);
      } catch (e) {}
    }
    document.addEventListener('click', pop, true); // captura: suena en CUALQUIER clic
  })();
  </script>
</body>
